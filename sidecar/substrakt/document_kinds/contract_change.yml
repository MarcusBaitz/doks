# yaml-language-server: $schema=document_kind.schema.json
#
# Contract changes (Nachträge) to an insurance policy. A Nachtrag states the
# contract as it stands after the change, so it carries the values of a policy
# plus the date and number of the change.

name: contract_change
title: Nachtrag
description: Nachträge und Änderungsmitteilungen zu einem Versicherungsschein.

recognition:
  title_patterns:
    - 'Nachtrag'
    - 'Änderungsmitteilung'
    - 'Vertragsänderung'

# Legal forms identify the insurer's line in the letterhead.
legal_forms:
  - 'AG'
  - 'SE'
  - 'VVaG'
  - 'a\.\s?G'
  - 'eG'
  - 'Versicherungsverein'

# Labels without a value of their own end another value's search area.
boundaries:
  - 'Kundennummer'
  - 'Kunden[-\s]*Nr\.?'
  - 'Vermittler(?:nummer)?'
  - 'Agentur'
  - 'Telefon'
  - 'Tel\.?'
  - 'E-Mail'
  - 'IBAN'
  - 'BIC'
  - 'Sachbearbeiter(?:in)?'
  - 'Geburtsdatum'
  - 'Risikoort'
  - 'Versicherungssumme'
  - 'Selbstbeteiligung'

fields:
  - name: insurer
    label: Versicherer
    question: Welche Gesellschaft versichert?
    json_type: string
    label_rule:
      patterns: ['Versicherer', 'Risikoträger', 'Gesellschaft']
      value: company
      # Without a label the insurer stands in the letterhead above the address.
      letterhead_until: ['Herrn?\b', 'Frau\b', 'Firma\b', 'Familie\b', 'Eheleute\b']

  - name: policy_number
    label: Versicherungsscheinnummer
    question: Wie lautet die Versicherungsscheinnummer?
    json_type: string
    label_rule:
      patterns:
        - 'Versicherungsschein[-\s]*(?:Nr\.?|Nummer)'
        - 'Versicherungsscheinnummer'
        - 'Versicherungs(?:nummer|[-\s]*Nr\.?)'
        - 'Vertrags(?:nummer|[-\s]*Nr\.?)'
        - 'Policen?(?:nummer|[-\s]*Nr\.?)'
        - 'VS[-\s]*Nr\.?'
      value: identifier

  - name: policyholder
    label: Versicherungsnehmer
    question: Wer ist Versicherungsnehmer?
    json_type: string
    label_rule:
      patterns: ['Versicherungsnehmer(?:in)?']
      value: text

  - name: line_of_business
    label: Sparte
    question: Welche Sparte ist versichert?
    json_type: string
    label_rule:
      patterns: ['Sparte', 'Versicherungsart', 'Vertragsart', 'Versicherungszweig']
      value: term
      # The line of business often stands only in the heading.
      unlabelled: true
      terms:
        Hausrat: [Hausratversicherung, Hausrat-Versicherung]
        Wohngebäude: [Wohngebäudeversicherung, Wohngebäude-Versicherung, Gebäudeversicherung]
        Privathaftpflicht: [Privathaftpflichtversicherung, Privat-Haftpflichtversicherung, Private Haftpflichtversicherung]
        Betriebshaftpflicht: [Betriebshaftpflichtversicherung, Betriebs-Haftpflichtversicherung]
        Kraftfahrt: [Kraftfahrtversicherung, Kraftfahrzeugversicherung, Kfz-Versicherung, Kfz-Haftpflichtversicherung]
        Rechtsschutz: [Rechtsschutzversicherung, Rechtsschutz-Versicherung]
        Unfall: [Unfallversicherung, Unfall-Versicherung]
        Glas: [Glasversicherung, Glas-Versicherung]

  - name: change_number
    label: Nachtragsnummer
    question: Der wievielte Nachtrag ist es?
    json_type: string
    label_rule:
      patterns: ['Nachtrags?[-\s]*(?:Nr\.?|nummer)']
      value: identifier

  - name: change_date
    label: Änderung zum
    question: Ab wann gilt die Änderung?
    json_type: date
    label_rule:
      patterns: ['Änderung\s+(?:zum|ab)', 'Änderung\s+wirksam\s+(?:ab|zum)', 'Wirksam\s+(?:ab|zum)', 'Gültig\s+ab', 'Änderungsdatum', 'Änderungstermin']
      value: date

  - name: start_date
    label: Beginn
    question: Wann beginnt der Versicherungsschutz?
    json_type: date
    label_rule:
      patterns: ['Versicherungsbeginn', 'Vertragsbeginn', 'Beginn\s+der\s+Versicherung', 'Beginn']
      value: date

  - name: end_date
    label: Ablauf
    question: Wann läuft der Vertrag ab?
    json_type: date
    label_rule:
      patterns: ['Versicherungsablauf', 'Vertragsablauf', 'Ablauf\s+der\s+Versicherung', 'Ablaufdatum', 'Ablauf']
      value: date

  - name: issue_date
    label: Ausstellungsdatum
    question: Wann wurde der Nachtrag ausgestellt?
    json_type: date
    label_rule:
      patterns: ['Ausfertigungsdatum', 'Ausstellungsdatum', 'Ausgestellt\s+am', 'Datum']
      value: date

  - name: payment_mode
    label: Zahlweise
    question: Wie oft wird der Beitrag gezahlt?
    json_type: string
    label_rule:
      patterns: ['Zahlweise', 'Zahlungsweise', 'Zahlungsperiode', 'Zahlungsart']
      value: term
      terms:
        jährlich: [jährliche, ganzjährlich, 1/1]
        halbjährlich: [halbjährliche, 1/2]
        vierteljährlich: [vierteljährliche, quartalsweise, 1/4]
        monatlich: [monatliche, 1/12]
        einmalig: [Einmalbeitrag]

  - name: premium
    label: Beitrag
    question: Wie hoch ist der Beitrag je Zahlungsabschnitt einschließlich Versicherungsteuer?
    json_type: number
    label_rule:
      patterns: ['Neuer\s+Beitrag', 'Gesamtbeitrag', 'Bruttobeitrag', 'Zahlbeitrag', 'Beitrag\s+(?:inkl|einschl|incl)\.?\s+Versicherung(?:s)?steuer', 'Beitrag\s+gemäß\s+Zahl(?:ungs)?weise', 'Beitrag', 'Prämie']
      value: amount

  # The amount for a whole year. It is a value of its own because a hand-over
  # asks for the amount per payment period, and with instalments the two differ
  # by more than a division: instalments carry a surcharge.
  - name: annual_premium
    label: Jahresbeitrag
    question: Wie hoch ist der Beitrag für ein Jahr einschließlich Versicherungsteuer?
    json_type: number
    label_rule:
      patterns: ['Jahresbeitrag', 'Jahresprämie', 'Beitrag\s+(?:pro|je)\s+Jahr', 'Jährlicher\s+Beitrag']
      value: amount

  - name: net_premium
    label: Nettobeitrag
    question: Wie hoch ist der Beitrag ohne Versicherungsteuer?
    json_type: number
    label_rule:
      patterns: ['Nettobeitrag', 'Beitrag\s+(?:ohne|exkl\.?)\s+Versicherung(?:s)?steuer', 'Beitrag\s+netto']
      value: amount

# Two files with different content that agree in all of these values are a
# possible duplicate: the same paper scanned twice. A person decides.
same_document: [policy_number, change_date]
